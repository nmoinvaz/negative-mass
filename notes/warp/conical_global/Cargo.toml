[package]
name = "conical_global"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
multishoot = { git = "https://github.com/nmoinvaz/multishoot", rev = "ff24b6bc316540d8fc11cd844b6861236ba0eed4" }
multisolver = "=0.2.2"
multidouble = "=5.1.0"

[features]
# the implicit-ODE recursion and the walk of multishoot::implicit in place of poly.rs and hp.rs (issue #190)
implicit_lib = ["multishoot/mutate"]

[profile.release]
opt-level = 3
