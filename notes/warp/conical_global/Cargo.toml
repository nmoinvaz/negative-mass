[package]
name = "conical_global"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
multishoot = "=5.0.0"
multisolver = "=0.3.0"
multidouble = "=6.1.0"

[features]
# the implicit-ODE recursion and the walk of multishoot::implicit in place of poly.rs and hp.rs (issue #190)
implicit_lib = ["multishoot/mutate"]

[profile.release]
opt-level = 3
