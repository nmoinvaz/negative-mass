[package]
name = "conical_global"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
multishoot = { git = "https://github.com/nmoinvaz/multishoot", rev = "eaf55a8d53b9a1379b64a60f4f14e59ccc270687" }
multisolver = "=0.2.2"
multidouble = "=5.1.0"

[features]
# the implicit-ODE recursion and the walk of multishoot::implicit in place of poly.rs and hp.rs (issue #190)
implicit_lib = ["multishoot/mutate"]

[profile.release]
opt-level = 3
