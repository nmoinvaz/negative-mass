<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif" font-size="13">
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- left: (x+, x-) grid -->
  <text x="40" y="26" font-size="15" font-weight="bold">Computational domain (x⁺, x⁻), both universes</text>
  <rect x="60" y="60" width="330" height="330" fill="#f4f6fa" stroke="#444" stroke-width="1.5"/>
  <line x1="60" y1="390" x2="390" y2="60" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="258" y="212" fill="#c0392b" transform="rotate(-45 258 212)" text-anchor="middle">throat line x⁺ = x⁻ (static)</text>
  <circle cx="60" cy="390" r="5" fill="#c0392b"/>
  <text x="66" y="410">S: corner at the throat, x⁺ = x⁻ = 0</text>
  <line x1="60" y1="390" x2="390" y2="390" stroke="#1f6fb2" stroke-width="3"/>
  <text x="225" y="428" text-anchor="middle" fill="#1f6fb2">Σ⁺ : x⁻ = 0, data r, f, φ, ψ (right universe, l &gt; 0)</text>
  <line x1="60" y1="390" x2="60" y2="60" stroke="#1f6fb2" stroke-width="3"/>
  <text x="48" y="225" text-anchor="middle" fill="#1f6fb2" transform="rotate(-90 48 225)">Σ⁻ : x⁺ = 0 (left universe, l &lt; 0)</text>
  <line x1="390" y1="390" x2="390" y2="60" stroke="#27864a" stroke-width="3"/>
  <text x="400" y="225" fill="#27864a" transform="rotate(90 400 225)" text-anchor="middle">edge x⁺ = X: M_R(x⁻), right end</text>
  <line x1="60" y1="60" x2="390" y2="60" stroke="#27864a" stroke-width="3"/>
  <text x="225" y="50" text-anchor="middle" fill="#27864a">edge x⁻ = X: M_L(x⁺), left end</text>
  <ellipse cx="300" cy="390" rx="22" ry="9" fill="#e8a33d" opacity="0.8"/>
  <text x="300" y="378" text-anchor="middle" fill="#8a5a00">pulse φ(x⁺, 0)</text>
  <path d="M300 381 L300 300" stroke="#8a5a00" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8a5a00"/></marker></defs>
  <text x="228" y="150" fill="#555">no outer boundary:</text><text x="228" y="166" fill="#555">domain = future of S,</text><text x="228" y="182" fill="#555">edges are null lines</text>
  <!-- right: (l, t) -->
  <text x="470" y="26" font-size="15" font-weight="bold">The same domain in (l, t)</text>
  <line x1="680" y1="390" x2="680" y2="60" stroke="#888" stroke-dasharray="3 4"/>
  <line x1="680" y1="390" x2="850" y2="220" stroke="#1f6fb2" stroke-width="3"/>
  <line x1="680" y1="390" x2="510" y2="220" stroke="#1f6fb2" stroke-width="3"/>
  <line x1="850" y1="220" x2="680" y2="50" stroke="#27864a" stroke-width="3"/>
  <line x1="510" y1="220" x2="680" y2="50" stroke="#27864a" stroke-width="3"/>
  <circle cx="680" cy="390" r="5" fill="#c0392b"/>
  <text x="690" y="408">S</text>
  <text x="690" y="75" fill="#c0392b">throat worldline, t = √2 X at the top</text>
  <text x="812" y="240" fill="#27864a">right end</text>
  <text x="520" y="240" fill="#27864a">left end</text>
  <text x="560" y="320" fill="#1f6fb2" text-anchor="middle">Σ⁻</text><text x="800" y="320" fill="#1f6fb2" text-anchor="middle">Σ⁺</text>
  <text x="680" y="445" text-anchor="middle" fill="#444">l = (x⁺ − x⁻)/√2,  t = (x⁺ + x⁻)/√2,  dx⁺dx⁻ = dl dt</text>
</svg>
